version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sih_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih_master
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/sih_master
      - JWT_SECRET=change-this-in-production-to-a-secure-secret-key-32-chars
      - EMBEDDING_PROVIDER=sentence_transformers
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LLM_PROVIDER=none
      - RERANKER_PROVIDER=none
      - HF_HOME=/models
    ports:
      - "8000:8000"
    volumes:
      - models:/models
      - ./backend:/app
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sih_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  models:
