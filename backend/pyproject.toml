[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-backend"
version = "0.1.0"
description = "National Unified Material Master Framework API & Engine"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "sentence-transformers>=2.6.1",
    "scikit-learn>=1.4.1",
    "rapidfuzz>=3.6.2",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "flake8>=7.0.0"
]
